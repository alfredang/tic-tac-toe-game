<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic-Tac-Toe</title>
    <meta name="description" content="A sleek, modern Tic-Tac-Toe game built with vanilla HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="container">
        <!-- Header Section -->
        <header class="game-header">
            <div class="logo">
                <span class="x-mark">X</span>
                <span class="o-mark">O</span>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" id="mode-pvp" data-mode="pvp">2 PLAYER</button>
                <button class="mode-btn" id="mode-ai" data-mode="ai">VS CPU</button>
            </div>

            <div class="turn-indicator" id="turn-indicator">
                <span class="turn-icon">X</span> TURN
            </div>

            <button class="btn-reset" id="reset-btn" aria-label="Reset Game">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                    <path
                        d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 153.5T440-202v80Zm80 0v-80q87-16 143.5-81.5T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 121-79.5 211.5T520-122Z" />
                </svg>
            </button>
        </header>

        <!-- Game Board -->
        <section class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </section>

        <!-- Score/Stats Section (Optional Polish) -->
        <section class="game-stats">
            <div class="stat-box player-x">
                <span class="stat-label">X (P1)</span>
                <span class="stat-value" id="score-x">0</span>
            </div>
            <div class="stat-box ties">
                <span class="stat-label">TIES</span>
                <span class="stat-value" id="score-tie">0</span>
            </div>
            <div class="stat-box player-o">
                <span class="stat-label">O (P2)</span>
                <span class="stat-value" id="score-o">0</span>
            </div>
        </section>
    </main>

    <!-- Result Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-message">PLAYER 1 WINS!</h2>
            <div class="modal-icon" id="modal-icon">
                <!-- Icon inserted via JS -->
            </div>
            <div class="modal-actions">
                <button class="btn-quit" id="quit-btn">QUIT</button>
                <button class="btn-next-round" id="next-round-btn">NEXT ROUND</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-click-x" src="assets/sounds/click-x.mp3" preload="auto"></audio>
    <audio id="sound-click-o" src="assets/sounds/click-o.mp3" preload="auto"></audio>
    <audio id="sound-win" src="assets/sounds/win.mp3" preload="auto"></audio>
    <audio id="sound-draw" src="assets/sounds/draw.mp3" preload="auto"></audio>
    <audio id="sound-restart" src="assets/sounds/restart.mp3" preload="auto"></audio>

    <script src="javascript/script.js"></script>
</body>

</html>
